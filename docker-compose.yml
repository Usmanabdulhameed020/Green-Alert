version: '3.8'

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'

  server:
    build: ./server
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - ./server/.env
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://usmansalimatayodele_db_user:oluwashola@ac-nqp0pnu-shard-00-00.99xcoyf.mongodb.net:27017,ac-nqp0pnu-shard-00-01.99xcoyf.mongodb.net:27017,ac-nqp0pnu-shard-00-02.99xcoyf.mongodb.net:27017/?ssl=true&replicaSet=atlas-9a0znx-shard-0&authSource=admin&appName=Cluster0
    volumes:
      - ./server/logs:/app/logs

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server

volumes:
  mongo_data:
